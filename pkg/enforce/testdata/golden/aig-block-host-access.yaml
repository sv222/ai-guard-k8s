apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: aig-block-host-access
spec:
  background: true
  rules:
  - exclude:
      any:
      - resources:
          namespaces:
          - kube-system
          - kube-public
          - kube-node-lease
    match:
      any:
      - resources:
          kinds:
          - Pod
          selector:
            matchLabels:
              ai.infra.guard/enabled: "true"
    name: block-host-access
    validate:
      message: AI inference pods must not use hostNetwork, hostPID or hostPath volumes
      pattern:
        spec:
          =(hostNetwork): "false"
          =(hostPID): "false"
          =(volumes):
          - X(hostPath): "null"
  validationFailureAction: Audit
