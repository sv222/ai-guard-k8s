apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm
  namespace: llm
  labels:
    app: vllm
spec:
  selector:
    matchLabels:
      app: vllm
  template:
    metadata:
      labels:
        app: vllm
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: fetch
          image: busybox:1.36
          securityContext:
            allowPrivilegeEscalation: false
          resources:
            requests: { cpu: 100m, memory: 64Mi }
            limits: { memory: 128Mi }
      containers:
        - name: server
          image: vllm/vllm-openai:v0.6.0
          args: ["--model", "mistralai/Mistral-7B-Instruct-v0.2"]
          env:
            - name: VLLM_API_KEY
              valueFrom:
                secretKeyRef: { name: vllm-key, key: key }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests: { cpu: "1", memory: 8Gi }
            limits: { memory: 16Gi, nvidia.com/gpu: "1" }
---
apiVersion: v1
kind: Service
metadata:
  name: vllm
  namespace: llm
spec:
  type: ClusterIP
  selector:
    app: vllm
  ports:
    - port: 8000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vllm-isolate
  namespace: llm
spec:
  podSelector:
    matchLabels:
      app: vllm
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              team: apps
      ports:
        - port: 8000
  egress:
    - ports:
        - port: 53
          protocol: UDP
