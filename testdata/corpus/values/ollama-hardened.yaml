podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]
resources:
  requests:
    cpu: "1"
    memory: 4Gi
  limits:
    memory: 8Gi
extraEnv:
  - name: OLLAMA_API_KEY
    valueFrom:
      secretKeyRef:
        name: ollama-auth
        key: key
