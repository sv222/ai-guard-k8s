namespace: llm
resources:
  - ../base
  - networkpolicy.yaml
patches:
  - target:
      kind: Deployment
      name: vllm
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/args
        value: ["--model", "m"]
      - op: add
        path: /spec/template/spec/containers/0/securityContext/capabilities
        value:
          add: ["NET_ADMIN"]
