apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-hf
  namespace: llm
spec:
  selector:
    matchLabels:
      app: vllm-hf
  template:
    metadata:
      labels:
        app: vllm-hf
    spec:
      containers:
        - name: server
          image: vllm/vllm-openai:v0.9.1
          envFrom:
            - secretRef:
                name: hf-token
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-keyed
  namespace: llm
spec:
  selector:
    matchLabels:
      app: vllm-keyed
  template:
    metadata:
      labels:
        app: vllm-keyed
    spec:
      containers:
        - name: server
          image: vllm/vllm-openai:v0.9.1
          envFrom:
            - secretRef:
                name: vllm-api-key
