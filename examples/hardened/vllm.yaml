apiVersion: v1
kind: Namespace
metadata:
  name: llm
---
apiVersion: v1
kind: Secret
metadata:
  name: vllm-api-key
  namespace: llm
type: Opaque
stringData:
  key: REPLACE_WITH_A_RANDOM_KEY
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm
  namespace: llm
  labels:
    app: vllm
    ai.infra.guard/enabled: "true"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vllm
  template:
    metadata:
      labels:
        app: vllm
        ai.infra.guard/enabled: "true"
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: vllm
          image: vllm/vllm-openai-cpu:v0.31.0-x86_64
          args:
            - --model=facebook/opt-125m
            - --served-model-name=opt-125m
            - --host=0.0.0.0
            - --port=8000
            - --dtype=float32
            - --max-model-len=512
            - --enforce-eager
          env:
            - name: VLLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: vllm-api-key
                  key: key
            - name: HOME
              value: /data
            - name: HF_HOME
              value: /data/hf
            - name: XDG_CACHE_HOME
              value: /data/cache
            - name: VLLM_CACHE_ROOT
              value: /data/vllm
            - name: VLLM_CONFIG_ROOT
              value: /data/vllm-config
            - name: TORCHINDUCTOR_CACHE_DIR
              value: /tmp/inductor
            - name: VLLM_CPU_KVCACHE_SPACE
              value: "1"
            - name: VLLM_CPU_OMP_THREADS_BIND
              value: nobind
          ports:
            - name: http
              containerPort: 8000
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: "1"
              memory: 3Gi
            limits:
              memory: 5Gi
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 90
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: data
          emptyDir:
            sizeLimit: 4Gi
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: vllm
  namespace: llm
spec:
  type: ClusterIP
  selector:
    app: vllm
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vllm-allow-clients
  namespace: llm
spec:
  podSelector:
    matchLabels:
      app: vllm
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              vllm-client: "true"
      ports:
        - port: 8000
          protocol: TCP
