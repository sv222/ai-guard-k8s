apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: aig-require-resources
spec:
  background: true
  rules:
  - exclude:
      any:
      - resources:
          namespaces:
          - kube-system
          - kube-public
          - kube-node-lease
    match:
      any:
      - resources:
          kinds:
          - Pod
          selector:
            matchLabels:
              ai.infra.guard/enabled: "true"
    name: require-resources
    validate:
      message: AI inference containers and init containers must set requests and limits
      pattern:
        spec:
          =(initContainers):
          - resources:
              limits:
                memory: ?*
              requests:
                cpu: ?*
                memory: ?*
          containers:
          - resources:
              limits:
                memory: ?*
              requests:
                cpu: ?*
                memory: ?*
  validationFailureAction: Audit
