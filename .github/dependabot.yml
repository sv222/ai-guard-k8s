version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      kubernetes:
        patterns:
          - "k8s.io/*"
          - "sigs.k8s.io/*"
    ignore:
      # kustomize 0.21.3 needs kube-openapi on structured-merge-diff v7,
      # which k8s.io/apimachinery 0.37.x does not support yet
      - dependency-name: "sigs.k8s.io/kustomize/*"
        versions: ["0.21.3"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
